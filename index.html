<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지역별 판매점 데이터 통합 복합 검색 필터 시스템</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 15px; background-color: #f3f4f6; color: #1f2937; margin: 0; }
        .container { max-width: 1400px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #111827; margin-bottom: 20px; font-size: 22px; }

        .upload-section { background: #f0fdf4; border: 2px dashed #bbf7d0; border-radius: 8px; padding: 15px; margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
        .upload-info { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #166534; }
        .upload-info b { color: #15803d; }
        .file-label { background-color: #16a34a; color: white; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; display: inline-block; transition: background 0.2s; }
        .file-label:hover { background-color: #15803d; }
        #csv-file { display: none; }

        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 25px; }
        .filter-group { display: flex; flex-direction: column; position: relative; }
        .filter-group label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #4b5563; }
        .search-input { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; box-sizing: border-box; width: 100%; background-color: #fff; }
        
        .dropdown-list { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #d1d5db; border-radius: 0 0 6px 6px; max-height: 180px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); z-index: 1000; display: none; margin: 0; padding: 0; list-style: none; }
        .dropdown-list li { padding: 10px 12px; cursor: pointer; font-size: 14px; text-align: left; }
        .dropdown-list li:hover { background-color: #f3f4f6; }
        .btn-reset { padding: 10px; background-color: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: auto; }
        .btn-reset:hover { background-color: #dc2626; }

        /* 📱 모바일 스크롤 터치 최적화 레이어 */
        .table-container { 
            overflow-x: auto; 
            border: 1px solid #e5e7eb; 
            border-radius: 8px; 
            max-height: 600px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; /* 모바일 부드러운 스크롤 */
            background: #ffffff;
        }
        
        /* 📱 테이블 내용이 찌그러지지 않도록 절대 너비 및 정렬 고정 */
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 13px; 
            text-align: center;
            table-layout: auto;
        }
        
        th, td { 
            padding: 12px 10px; 
            border-bottom: 1px solid #e5e7eb; 
            white-space: nowrap; /* 🚀 글자가 밑으로 쪼개져서 떨어지는 현상 원천 방지 */
            vertical-align: middle;
        }
        
        th { background-color: #f3f4f6; color: #374151; font-weight: 700; position: sticky; top: 0; z-index: 10; }
        tr:hover { background-color: #f9fafb; }
        
        /* 🚀 각 열(Column)별 최소 너비 확보로 글자 겹침 방지 */
        th:nth-child(1), td:nth-child(1) { min-width: 80px; }  /* P코드 */
        th:nth-child(2), td:nth-child(2) { min-width: 130px; white-space: normal; word-break: keep-all; } /* 거래처명 */
        th:nth-child(3), td:nth-child(3) { min-width: 80px; }  /* 읍면동 */
        th:nth-child(4), td:nth-child(4) { min-width: 250px; white-space: normal; word-break: keep-all; } /* 상세주소 */
        th:nth-child(5), td:nth-child(5) { min-width: 120px; white-space: normal; word-break: keep-all; } /* 대리점명 */
        th:nth-child(6), td:nth-child(6) { min-width: 90px; }  /* 중복여부 */
        th:nth-child(7), td:nth-child(7) { min-width: 90px; }  /* 대리점실적 */
        th:nth-child(8), td:nth-child(8) { min-width: 90px; }  /* P코드합계 */
        
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
        .badge-total { background-color: #e0f2fe; color: #0369a1; }
        .badge-score { background-color: #dcfce7; color: #166534; }
        .badge-type { background-color: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; }
        .text-left { text-align: left; }
        .total-count { font-size: 16px; font-weight: bold; color: #2563eb; margin-bottom: 10px; }

        /* 모바일 화면 전용 스크롤 팁 안내 안내 */
        .scroll-tip { display: none; font-size: 11px; color: #9ca3af; text-align: right; margin-bottom: 5px; }
        @media (max-width: 768px) {
            .scroll-tip { display: block; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏢 판매점 데이터 통합 조회 시스템</h2>

    <div class="upload-section">
        <div class="upload-info">
            <span>📊 <b>분석 대상 파일:</b> <span id="target-file-name" style="font-weight: bold; color: #2563eb;">전거래처_PS중복.csv (서버 자동 연동)</span></span>
        </div>
        <div>
            <label for="csv-file" class="file-label">📂 다른 파일 첨부/교체</label>
            <input type="file" id="csv-file" accept=".csv" onchange="handleFileSelect(event)">
        </div>
    </div>

    <div class="filter-grid">
        <div class="filter-group">
            <label>거래처명 검색</label>
            <input type="text" id="search-name" class="search-input" placeholder="🔍 거래처명 입력" onfocus="showDropdown('name')" oninput="filterDropdown('name')" autocomplete="off">
            <ul id="name-list" class="dropdown-list"></ul>
        </div>
        <div class="filter-group">
            <label>시군구명 검색</label>
            <input type="text" id="search-sigungu" class="search-input" placeholder="🔍 시군구명 입력" onfocus="showDropdown('sigungu')" oninput="filterDropdown('sigungu')" autocomplete="off">
            <ul id="sigungu-list" class="dropdown-list"></ul>
        </div>
        <div class="filter-group">
            <label>읍면동명 검색</label>
            <input type="text" id="search-dong" class="search-input" placeholder="🔍 읍면동명 입력" onfocus="showDropdown('dong')" oninput="filterDropdown('dong')" autocomplete="off">
            <ul id="dong-list" class="dropdown-list"></ul>
        </div>
        <div class="filter-group">
            <label>중복여부 검색</label>
            <input type="text" id="search-type" class="search-input" placeholder="🔍 중복여부 선택" onfocus="showDropdown('type')" oninput="filterDropdown('type')" autocomplete="off">
            <ul id="type-list" class="dropdown-list"></ul>
        </div>
        <button class="btn-reset" onclick="resetAllFilters()">필터 초기화</button>
    </div>

    <div>
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div class="total-count">📊 조회된 판매점 목록: <span id="count">0</span>건</div>
            <div class="scroll-tip">💡 좌우로 밀어서 표를 확인하세요</div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>P코드</th>
                        <th>거래처명</th>
                        <th>읍면동</th>
                        <th class="text-left">상세주소</th>
                        <th>대리점명</th>
                        <th>중복여부</th>
                        <th>대리점실적</th>
                        <th>P코드합계</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td id="status-msg" colspan="8" style="padding:30px; color:#2563eb; font-weight:bold;">🔄 데이터를 검증하고 매칭하는 중입니다...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
let csvData = [];
let filters = { name: "", sigungu: "", dong: "", type: "" };

window.onload = function() {
    const currentUrl = window.location.href.split('?')[0].split('#')[0];
    const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/')) + '/';
    const targetFileUrl = baseUrl + '전거래처_PS중복.csv';

    fetch(targetFileUrl)
    .then(res => {
        if(!res.ok) throw new Error("서버 파일 로드 실패 (코드: " + res.status + ")");
        return res.blob(); 
    })
    .then(blob => {
        parseCSVFile(blob);
    })
    .catch(err => {
        document.getElementById('status-msg').innerHTML = `<span style="color:#ef4444;">⚠️ 서버 데이터 로드 실패<br>[원인]: ${err.message}</span>`;
    });
};

function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById('target-file-name').textContent = `${file.name} (사용자 첨부 파일)`;
    document.getElementById('table-body').innerHTML = `<tr><td id="status-msg" colspan="8" style="padding:30px; color:#16a34a; font-weight:bold;">📂 데이터를 추출하고 복원하는 중...</td></tr>`;
    
    parseCSVFile(file);
}

function parseCSVFile(fileOrBlob) {
    Papa.parse(fileOrBlob, {
        header: false,
        skipEmptyLines: true,
        encoding: "UTF-8", 
        complete: function(results) {
            let rows = results.data;
            if(!rows || rows.length === 0) return;
            
            const sampleText = rows.slice(0, 5).map(r => r.join('')).join('');
            if (sampleText.includes('') || sampleText.includes('거래처명') === false && sampleText.match(/[ㄱ-ㅎㅏ-ㅣ가-힣]/) === null) {
                Papa.parse(fileOrBlob, {
                    header: false,
                    skipEmptyLines: true,
                    encoding: "EUC-KR",
                    complete: function(eucResults) {
                        processRows(eucResults.data);
                    }
                });
            } else {
                processRows(rows);
            }
        }
    });
}

function processRows(rows) {
    if(!rows || rows.length <= 1) {
        document.getElementById('status-msg').innerHTML = `⚠️ 엑셀 파일 내에 유효한 데이터가 존재하지 않습니다.`;
        return;
    }

    const headerRow = rows[0].map(h => h ? h.toString().trim().replace(/\s+/g, '') : '');
    
    const idxPcode = headerRow.findIndex(h => h.includes('P코드')) !== -1 ? headerRow.findIndex(h => h.includes('P코드')) : 0;
    const idxName = headerRow.findIndex(h => h.includes('거래처명') || h.includes('거래처')) !== -1 ? headerRow.findIndex(h => h.includes('거래처명') || h.includes('거래처')) : 1;
    const idxSido = headerRow.findIndex(h => h.includes('시도')) !== -1 ? headerRow.findIndex(h => h.includes('시도')) : 2;
    const idxSigungu = headerRow.findIndex(h => h.includes('시군구')) !== -1 ? headerRow.findIndex(h => h.includes('시군구')) : 3;
    const idxDong = headerRow.findIndex(h => h.includes('읍면동')) !== -1 ? headerRow.findIndex(h => h.includes('읍면동')) : 4;
    const idxAddress = headerRow.findIndex(h => h.includes('주소') || h.includes('상세주소')) !== -1 ? headerRow.findIndex(h => h.includes('주소') || h.includes('상세주소')) : 5;
    const idxType = headerRow.findIndex(h => h.includes('중복여부') || h.includes('중복')) !== -1 ? headerRow.findIndex(h => h.includes('중복여부') || h.includes('중복')) : 7;
    
    const idxScore = headerRow.findIndex(h => h.includes('대리점실적') || h.includes('실적')) !== -1 ? headerRow.findIndex(h => h.includes('대리점실적') || h.includes('실적')) : 8;
    const idxTotalScore = headerRow.findIndex(h => h.includes('P코드합계') || h.includes('P코드실적') || h.includes('합계')) !== -1 ? headerRow.findIndex(h => h.includes('P코드합계') || h.includes('P코드실적') || h.includes('합계')) : 9;

    let idxAgency = headerRow.findIndex(h => h === '대리점명' || h === '대리점');
    if(idxAgency === -1) { 
        idxAgency = headerRow.findIndex(h => h.includes('대리점') && !h.includes('코드'));
    }
    if(idxAgency === -1) idxAgency = 6;

    const dataRows = rows.slice(1);

    csvData = dataRows.map(row => {
        if (!row || row.length < 2 || !row[idxPcode]) return null;

        const parseNum = (val) => {
            if(!val) return 0;
            const clean = val.toString().replace(/,/g, '').trim();
            return parseInt(clean) || 0;
        };

        return {
            pcode: row[idxPcode] ? row[idxPcode].toString().trim() : '',
            name: row[idxName] ? row[idxName].toString().trim() : '',
            sido: row[idxSido] ? row[idxSido].toString().trim() : '',
            sigungu: row[idxSigungu] ? row[idxSigungu].toString().trim() : '',
            dong: row[idxDong] ? row[idxDong].toString().trim() : '',
            address: row[idxAddress] ? row[idxAddress].toString().trim() : '공백',
            agency: row[idxAgency] ? row[idxAgency].toString().trim() : '',
            type: row[idxType] ? row[idxType].toString().trim() : '정보없음',
            score: parseNum(row[idxScore]),        
            total_score: parseNum(row[idxTotalScore]) 
        };
    }).filter(Boolean);

    if(csvData.length === 0) {
        document.getElementById('status-msg').innerHTML = `⚠️ 정상 데이터 매칭에 실패했습니다. 파일 형식을 확인해주세요.`;
        return;
    }

    resetAllFilters();
    initFilters();
}

function initFilters() {
    buildDropdown('name', csvData);
    buildDropdown('sigungu', csvData);
    buildDropdown('dong', csvData);
    buildDropdown('type', csvData);
    renderTable(csvData);
}

function buildDropdown(key, data) {
    const listEl = document.getElementById(`${key}-list`);
    const uniqueValues = [...new Set(data.map(item => item[key]))].filter(Boolean).sort();
    
    listEl.innerHTML = `<li onclick="selectValue('${key}', '')">-- 전체 --</li>`;
    uniqueValues.forEach(val => {
        const li = document.createElement('li');
        li.textContent = val;
        li.onclick = function(e) { 
            e.stopPropagation(); 
            selectValue(key, val); 
        };
        listEl.appendChild(li);
    });
}

function showDropdown(key) {
    document.querySelectorAll('.dropdown-list').forEach(el => el.style.display = 'none');
    document.getElementById(`${key}-list`).style.display = 'block';
}

function selectValue(key, val) {
    filters[key] = val;
    document.getElementById(`search-${key}`).value = val;
    document.getElementById(`${key}-list`).style.display = 'none';
    applyFilters(key);
}

function filterDropdown(key) {
    const input = document.getElementById(`search-${key}`).value.toLowerCase();
    const items = document.querySelectorAll(`#${key}-list li`);
    if(input === "") filters[key] = "";
    items.forEach((li, index) => {
        if(index === 0) return;
        const text = li.textContent.toLowerCase();
        li.style.display = text.includes(input) ? 'block' : 'none';
    });
    applyFilters(key);
}

function applyFilters(changedKey) {
    const filteredData = csvData.filter(item => {
        return (!filters.name || item.name.includes(filters.name)) &&
               (!filters.sigungu || item.sigungu.includes(filters.sigungu)) &&
               (!filters.dong || item.dong.includes(filters.dong)) &&
               (!filters.type || item.type.includes(filters.type));
    });

    const keys = ['name', 'sigungu', 'dong', 'type'];
    keys.forEach(k => {
        if (k !== changedKey && !filters[k]) {
            buildDropdown(k, filteredData);
        }
    });
    renderTable(filteredData);
}

function renderTable(data) {
    const tbody = document.getElementById('table-body');
    document.getElementById('count').textContent = data.length.toLocaleString();
    tbody.innerHTML = '';

    if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="color:#ef4444; padding:30px; font-weight:bold;">일치하는 조건의 데이터가 존재하지 않습니다.</td></tr>`;
        return;
    }

    const limitData = data.slice(0, 500); 
    limitData.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td><b>${item.pcode}</b></td>
                <td class="text-left"><b>${item.name}</b></td>
                <td>${item.dong}</td>
                <td class="text-left" style="color: #2563eb;">${item.address}</td>
                <td class="text-left">${item.agency}</td>
                <td><span class="badge badge-type">${item.type}</span></td>
                <td><span class="badge badge-score">${item.score.toLocaleString()}</span></td>
                <td><span class="badge badge-total">${item.total_score.toLocaleString()}</span></td>
            </tr>
        `;
    });

    if (data.length > 500) {
        tbody.innerHTML += `<tr><td colspan="8" style="padding:15px; background:#f3f4f6; color:#4b5563; font-weight:bold;">⚠️ 데이터가 너무 많아 상위 500개만 화면에 표시 중입니다. 필터를 이용해 범위를 좁혀주세요.</td></tr>`;
    }
}

function resetAllFilters() {
    filters = { name: "", sigungu: "", dong: "", type: "" };
    document.getElementById('search-name').value = "";
    document.getElementById('search-sigungu').value = "";
    document.getElementById('search-dong').value = "";
    document.getElementById('search-type').value = "";
    if(csvData.length > 0) initFilters();
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.filter-group')) {
        document.querySelectorAll('.dropdown-list').forEach(el => el.style.display = 'none');
    }
});
</script>
</body>
</html>

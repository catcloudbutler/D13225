<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 성능 최적화 버전</title>
    <!-- 카카오맵 API 라이브러리 로드 (본인의 APP KEY를 입력하세요) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_APP_KEY&libraries=services"></script>
    <style>
        /* 기본 스타일 예시 */
        #map { width: 100%; height: 400px; margin-bottom: 20px; }
        .filter-container { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-container input, .filter-container select { padding: 8px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <!-- 필터 영역 -->
    <div class="filter-container">
        <input type="text" id="sidoInput" placeholder="시도명 입력" oninput="debouncedFilter()">
        <input type="text" id="gugunInput" placeholder="시군구명 입력" oninput="debouncedFilter()">
    </div>

    <!-- 지도 영역 -->
    <div id="map"></div>

    <!-- 하단 리스트 테이블 -->
    <table id="listTable">
        <thead>
            <tr>
                <th>상호명</th>
                <th>주소</th>
                <th>거리 (km)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- 동적으로 행이 추가됩니다 -->
        </tbody>
    </table>

    <script>
        // --- 1. 설정값 정의 ---
        const MAX_MARKERS = 150;  // 지도에 표시할 최대 마커 수
        const MAX_LIST_ITEMS = 300; // 하단 테이블에 표시할 최대 리스트 수
        
        let map;
        let geocoder;
        let csvData = [];        // 전체 CSV 데이터 저장 배열
        let activeMarkers = [];  // 현재 지도에 표시 중인 마커 배열
        let debounceTimer;       // 디바운스 타이머 변수

        // 지도 초기화
        const mapContainer = document.getElementById('map');
        const mapOption = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 서울시청 기준
            level: 5
        };
        map = new kakao.maps.Map(mapContainer, mapOption);
        geocoder = new kakao.maps.services.Geocoder();

        // --- 2. 디바운스 필터 함수 (모바일 키보드 렉 방지) ---
        // 사용자가 타이핑을 멈추고 300ms(0.3초)가 지나면 딱 한 번만 필터링을 실행합니다.
        function debouncedFilter() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                applyFiltersAndRender();
            }, 300); 
        }

        // --- 3. 핵심 필터 및 렌더링 함수 ---
        function applyFiltersAndRender() {
            const sidoKeyword = document.getElementById('sidoInput').value.trim();
            const gugunKeyword = document.getElementById('gugunInput').value.trim();

            // ① 전체 데이터 중 조건에 맞는 데이터만 1차 필터링
            const filtered = csvData.filter(item => {
                const matchSido = !sidoKeyword || item.sido.includes(sidoKeyword);
                const matchGugun = !gugunKeyword || item.gugun.includes(gugunKeyword);
                return matchSido && matchGugun;
            });

            // ② 지도 마커 업데이트 (최대 150개 제한)
            updateMarkers(filtered.slice(0, MAX_MARKERS));

            // ③ 하단 리스트 테이블 업데이트 (최대 300개 제한)
            updateTable(filtered.slice(0, MAX_LIST_ITEMS));
        }

        // --- 4. 마커 관리 함수 ---
        function updateMarkers(dataList) {
            // 기존 마커 전체 삭제
            activeMarkers.forEach(marker => marker.setMap(null));
            activeMarkers = [];

            // 새 마커 추가
            dataList.forEach(data => {
                if (data.lat && data.lng) {
                    const markerPosition = new kakao.maps.LatLng(data.lat, data.lng);
                    
                    // 메모리 절약을 위해 가벼운 기본 이미지 마커 사용을 권장합니다.
                    const marker = new kakao.maps.Marker({
                        position: markerPosition,
                        map: map
                    });

                    // 마커 클릭 이벤트 예시
                    kakao.maps.event.addListener(marker, 'click', function() {
                        alert(data.name + '\n' + data.address);
                    });

                    activeMarkers.push(marker);
                }
            });
        }

        // --- 5. 테이블 관리 함수 ---
        function updateTable(dataList) {
            const tableBody = document.getElementById('tableBody');
            
            // 기존 테이블 비우기 (innerHTML을 비우는 것이 대량 데이터 삭제 시 빠름)
            tableBody.innerHTML = '';

            // 가상 DocumentFragment를 사용하여 일괄 추가 (렌더링 최적화)
            const fragment = document.createDocumentFragment();

            dataList.forEach(data => {
                const tr = document.createElement('tr');
                
                const tdName = document.createElement('td');
                tdName.textContent = data.name || '-';
                
                const tdAddress = document.createElement('td');
                tdAddress.textContent = data.address || '-';

                const tdDistance = document.createElement('td');
                tdDistance.textContent = data.distance ? `${data.distance.toFixed(2)} km` : '-';

                tr.appendChild(tdName);
                tr.appendChild(tdAddress);
                tr.appendChild(tdDistance);
                
                fragment.appendChild(tr);
            });

            tableBody.appendChild(fragment);
        }

        // --- 샘플 데이터 로드 및 초기 실행 테스트용 ---
        // (실제 프로젝트에서는 CSV 파일을 파싱한 데이터를 csvData 배열에 바인딩하시면 됩니다)
        window.onload = function() {
            // 예시용 가상 데이터 500개 생성
            for (let i = 1; i <= 500; i++) {
                csvData.push({
                    name: `상점 ${i}`,
                    address: i % 2 === 0 ? "서울특별시 중구 태평로1가" : "경기도 수원시 팔달구",
                    sido: i % 2 === 0 ? "서울" : "경기",
                    gugun: i % 2 === 0 ? "중구" : "수원시",
                    lat: 37.566826 + (Math.random() - 0.5) * 0.05,
                    lng: 126.9786567 + (Math.random() - 0.5) * 0.05,
                    distance: Math.random() * 5
                });
            }
            
            // 초기 1회 실행
            applyFiltersAndRender();
        };
    </script>
</body>
</html>

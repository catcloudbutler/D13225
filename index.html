<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지역별 판매점 데이터 통합 복합 검색 필터 시스템</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            padding: 20px;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            color: #111827;
            margin-bottom: 25px;
        }
        
        /* 필터 섹션: 4열 구조로 확장 */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 25px;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4b5563;
        }
        .search-input {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            width: 100%;
            background-color: #fff;
        }
        
        /* 공통 가상 드롭다운 리스트 */
        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 0 0 6px 6px;
            max-height: 180px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            z-index: 1000;
            display: none;
            margin: 0; padding: 0; list-style: none;
        }
        .dropdown-list li {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 14px;
        }
        .dropdown-list li:hover { background-color: #f3f4f6; }

        .btn-reset {
            padding: 10px;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin-top: auto;
        }
        .btn-reset:hover { background-color: #dc2626; }

        /* 테이블 디자인 */
        .table-container {
            overflow-x: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: center;
        }
        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background-color: #f3f4f6;
            color: #374151;
            font-weight: 700;
            position: sticky;
            top: 0;
        }
        tr:hover { background-color: #f9fafb; }
        
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-total { background-color: #e0f2fe; color: #0369a1; }
        .badge-score { background-color: #dcfce7; color: #166534; }
        .badge-type { background-color: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; }
        .text-left { text-align: left; }
        .total-count {
            font-size: 16px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏢 판매점 데이터 통합 조회 시스템 (지역 & 중복여부 복합 검색)</h2>

    <div class="filter-grid">
        <div class="filter-group">
            <label>시도명 검색</label>
            <input type="text" id="search-sido" class="search-input" placeholder="🔍 시도명 입력" onfocus="showDropdown('sido')" oninput="filterDropdown('sido')" autocomplete="off">
            <ul id="sido-list" class="dropdown-list"></ul>
        </div>

        <div class="filter-group">
            <label>시군구명 검색</label>
            <input type="text" id="search-sigungu" class="search-input" placeholder="🔍 시군구명 입력" onfocus="showDropdown('sigungu')" oninput="filterDropdown('sigungu')" autocomplete="off">
            <ul id="sigungu-list" class="dropdown-list"></ul>
        </div>

        <div class="filter-group">
            <label>읍면동명 검색</label>
            <input type="text" id="search-dong" class="search-input" placeholder="🔍 읍면동명 입력" onfocus="showDropdown('dong')" oninput="filterDropdown('dong')" autocomplete="off">
            <ul id="dong-list" class="dropdown-list"></ul>
        </div>

        <div class="filter-group">
            <label>중복여부 검색</label>
            <input type="text" id="search-type" class="search-input" placeholder="🔍 중복여부 선택 (예: 중복점)" onfocus="showDropdown('type')" oninput="filterDropdown('type')" autocomplete="off">
            <ul id="type-list" class="dropdown-list"></ul>
        </div>

        <button class="btn-reset" onclick="resetAllFilters()">필터 초기화</button>
    </div>

    <div>
        <div class="total-count">
            📊 조회된 판매점 목록: <span id="count">0</span>건
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>P코드</th>
                        <th>거래처명</th>
                        <th>시도</th>
                        <th>시군구</th>
                        <th>읍면동</th>
                        <th class="text-left">상세주소</th>
                        <th>대리점명</th>
                        <th>중복여부</th>
                        <th>실적</th>
                        <th>P코드합계</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// 원본 데이터셋 (0608_중복점.csv 데이터 반영)
const csvData = [
    { pcode: "PE1658", name: "주식회사 잎슬", sido: "서울", sigungu: "영등포구", dong: "양평동4가", address: "서울특별시 영등포구 선유로49길 23", agency: "삼보대리점", type: "수도권_전속", score: 271, total_score: 271 },
    { pcode: "PE6925", name: "휴대폰성지 굳폰 다산점", sido: "경기", sigungu: "남양주시", dong: "다산동", address: "경기도 남양주시 다산중앙로123번길 22-8", agency: "신창대리점", type: "수도권_전속", score: 235, total_score: 235 },
    { pcode: "PE7406", name: "합정 휴대폰성지 폰싼집", sido: "서울", sigungu: "마포구", dong: "서교동", address: "서울특별시 마포구 양화로 45", agency: "가능대리점", type: "중복점", score: 215, total_score: 217 },
    { pcode: "PE7196", name: "스타텔레콤", sido: "경기", sigungu: "수원시 권선구", dong: "탑동", address: "경기 수원시 권선구 상탑로39번길 12-2", agency: "코넥", type: "중복점", score: 103, total_score: 202 },
    { pcode: "PE3614", name: "성지휴대폰할인매장디몰", sido: "인천", sigungu: "남동구", dong: "만수동", address: "인천광역시 남동구 소래로669번길 51", agency: "참스타대리점", type: "수도권_전속", score: 195, total_score: 195 },
    { pcode: "PE2647", name: "하나통신", sido: "서울", sigungu: "구로구", dong: "구로동", address: "서울특별시 구로구 새말로 97", agency: "지은대리점", type: "중복점", score: 124, total_score: 155 },
    { pcode: "PE4085", name: "알뜰폰스토어 가능점", sido: "경기", sigungu: "의정부시", dong: "가능동", address: "경기도 의정부시 가능로 105", agency: "ACT대리점", type: "중복점", score: 81, total_score: 153 },
    { pcode: "PE3243", name: "휴대폰성지", sido: "서울", sigungu: "강동구", dong: "성내동", address: "서울특별시 강동구 양재대로 1377", agency: "ACE대리점", type: "중복점", score: 77, total_score: 143 },
    { pcode: "D15146", name: "PS&M 권선점", sido: "경기", sigungu: "수원시 권선구", dong: "권선동", address: "공백/데이터없음", agency: "PS&M", type: "PS_전속", score: 1, total_score: 1 },
    { pcode: "PE9233", name: "인천핸드폰성지 건모바일 인천", sido: "인천", sigungu: "연수구", dong: "송도동", address: "인천광역시 연수구 송도문화로 11", agency: "대리점정보없음", type: "정보없음", score: 0, total_score: 0 }
];

// 현재 필터 선택 상태 관리 객체 (type 추가)
let filters = { sido: "", sigungu: "", dong: "", type: "" };

function init() {
    buildDropdown('sido', csvData);
    buildDropdown('sigungu', csvData);
    buildDropdown('dong', csvData);
    buildDropdown('type', csvData);
    renderTable(csvData);
}

// 드롭다운 목록 생성 및 한글 정렬
function buildDropdown(key, data) {
    const listEl = document.getElementById(`${key}-list`);
    const uniqueValues = [...new Set(data.map(item => item[key]))].filter(Boolean).sort();
    
    listEl.innerHTML = `<li onclick="selectValue('${key}', '')">-- 전체 --</li>`;
    uniqueValues.forEach(val => {
        const li = document.createElement('li');
        li.textContent = val;
        li.onclick = function() { selectValue(key, val); };
        listEl.appendChild(li);
    });
}

function showDropdown(key) {
    document.querySelectorAll('.dropdown-list').forEach(el => el.style.display = 'none');
    document.getElementById(`${key}-list`).style.display = 'block';
}

// 목록에서 클릭 선택 시 처리
function selectValue(key, val) {
    filters[key] = val;
    document.getElementById(`search-${key}`).value = val;
    document.getElementById(`${key}-list`).style.display = 'none';
    
    applyFilters(key);
}

// 타이핑 검색 제어
function filterDropdown(key) {
    const input = document.getElementById(`search-${key}`).value.toLowerCase();
    const items = document.querySelectorAll(`#${key}-list li`);
    
    if(input === "") {
        filters[key] = "";
    }

    items.forEach((li, index) => {
        if(index === 0) return; // 전체선택 항시 노출
        const text = li.textContent.toLowerCase();
        li.style.display = text.includes(input) ? 'block' : 'none';
    });

    applyFilters(key);
}

// 4가지 복합 필터 복합 유기 연동 로직
function applyFilters(changedKey) {
    const filteredData = csvData.filter(item => {
        return (!filters.sido || item.sido.includes(filters.sido)) &&
               (!filters.sigungu || item.sigungu.includes(filters.sigungu)) &&
               (!filters.dong || item.dong.includes(filters.dong)) &&
               (!filters.type || item.type.includes(filters.type));
    });

    // 선택이 완료되지 않은 다른 필터들의候補 리스트도 실시간 결과 범위 안으로 동적 압축
    const keys = ['sido', 'sigungu', 'dong', 'type'];
    keys.forEach(k => {
        if (k !== changedKey && !filters[k]) {
            buildDropdown(k, filteredData);
        }
    });

    renderTable(filteredData);
}

// 테이블 랜더링
function renderTable(data) {
    const tbody = document.getElementById('table-body');
    document.getElementById('count').textContent = data.length;
    tbody.innerHTML = '';

    if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" style="color:#ef4444; padding:30px; font-weight:bold;">일치하는 조건의 데이터가 존재하지 않습니다.</td></tr>`;
        return;
    }

    data.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td><b>${item.pcode}</b></td>
                <td><b>${item.name}</b></td>
                <td>${item.sido}</td>
                <td>${item.sigungu}</td>
                <td>${item.dong}</td>
                <td class="text-left" style="color: #2563eb;">${item.address}</td>
                <td>${item.agency}</td>
                <td><span class="badge badge-type">${item.type}</span></td>
                <td><span class="badge badge-score">${item.score.toLocaleString()}</span></td>
                <td><span class="badge badge-total">${item.total_score.toLocaleString()}</span></td>
            </tr>
        `;
    });
}

// 전체 초기화
function resetAllFilters() {
    filters = { sido: "", sigungu: "", dong: "", type: "" };
    document.getElementById('search-sido').value = "";
    document.getElementById('search-sigungu').value = "";
    document.getElementById('search-dong').value = "";
    document.getElementById('search-type').value = "";
    init();
}

// 외곽 영역 클릭 시 드롭다운 자동으로 닫기
document.addEventListener('click', function(e) {
    if (!e.target.closest('.filter-group')) {
        document.querySelectorAll('.dropdown-list').forEach(el => el.style.display = 'none');
    }
});

window.onload = init;
</script>
</body>
</html>

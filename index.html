<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>지역별 판매점 데이터 통합 복합 검색 필터 시스템</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 10px; background-color: #f3f4f6; color: #1f2937; margin: 0; }
        .container { max-width: 1400px; margin: 0 auto; background: #ffffff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #111827; margin-bottom: 20px; font-size: 18px; }

        /* 업로드 섹션 스타일 */
        .upload-section { background: #f0fdf4; border: 2px dashed #bbf7d0; border-radius: 8px; padding: 10px; margin-bottom: 20px; font-size: 13px; color: #166534; }
        
        /* 필터 섹션: 모바일 2열 정렬 */
        .filter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 20px; }
        .filter-group { display: flex; flex-direction: column; position: relative; }
        .filter-group label { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #4b5563; }
        .search-input { padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; width: 100%; box-sizing: border-box; }
        .btn-reset { grid-column: span 2; padding: 10px; background-color: #ef4444; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }

        /* [핵심] 테이블 모바일 최적화 스타일 */
        .table-container { 
            overflow-x: auto; /* 가로 스크롤 활성화 */
            -webkit-overflow-scrolling: touch; /* 아이폰 부드러운 스크롤 */
            border: 1px solid #e5e7eb; 
            border-radius: 8px; 
            max-height: 500px; 
            overflow-y: auto; 
        }
        table { width: 100%; min-width: 800px; border-collapse: collapse; font-size: 12px; } /* min-width로 칸 찌그러짐 방지 */
        th, td { padding: 10px 8px; border-bottom: 1px solid #e5e7eb; text-align: center; white-space: nowrap; } /* nowrap으로 줄바꿈 방지 */
        th { background-color: #f3f4f6; color: #374151; font-weight: 700; position: sticky; top: 0; z-index: 10; }
        
        .map-link { color: #2563eb; text-decoration: none; }
        .badge { padding: 3px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; }
        .badge-type { background-color: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; }
        .badge-score { background-color: #dcfce7; color: #166534; }
        .badge-total { background-color: #e0f2fe; color: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏢 판매점 데이터 통합 조회 시스템</h2>

    <div class="upload-section">
        📊 분석 대상: <b id="target-file-name">전거래처_PS중복.csv</b>
    </div>

    <div class="filter-grid">
        <div class="filter-group"><label>시도명</label><input type="text" id="search-sido" class="search-input" oninput="applyFilters()" placeholder="입력..."></div>
        <div class="filter-group"><label>시군구명</label><input type="text" id="search-sigungu" class="search-input" oninput="applyFilters()" placeholder="입력..."></div>
        <div class="filter-group"><label>읍면동명</label><input type="text" id="search-dong" class="search-input" oninput="applyFilters()" placeholder="입력..."></div>
        <div class="filter-group"><label>중복여부</label><input type="text" id="search-type" class="search-input" oninput="applyFilters()" placeholder="입력..."></div>
        <button class="btn-reset" onclick="resetAllFilters()">필터 초기화</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>P코드</th><th>거래처명</th><th>읍면동</th><th>상세주소</th>
                    <th>대리점명</th><th>중복여부</th><th>대리점실적</th><th>P코드합계</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="8" style="padding:20px;">데이터 로딩 중...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 기존 시스템 로직과 동일하게 작동하며, 
    // 위 스타일 설정을 통해 모바일 가독성을 확보했습니다.
    // 나머지 로직(CSV 파싱, 필터 적용 등)은 기존 스크립트 그대로 사용하세요.
</script>
</body>
</html>

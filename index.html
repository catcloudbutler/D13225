<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>지역별 판매점 데이터 통합 복합 검색 필터 시스템</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=47d0f2bd29fbb279cb461bdad2cf1097&libraries=services"></script>
    
    <style>
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            padding: 15px; 
            background-color: #f3f4f6; 
            color: #1f2937; 
            margin: 0; 
            
            /* 🔒 [보안] 전체 복사/드래그 금지 */
            -webkit-user-select: none;  
            -moz-user-select: none;     
            -ms-user-select: none;      
            user-select: none;          
        }
        .container { max-width: 1400px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #111827; margin-bottom: 20px; font-size: 20px; }

        /* 🔒 서버 셧다운 레이아웃 */
        #server-lock-screen {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; z-index: 99999;
            flex-direction: column; align-items: center; justify-content: center;
            color: #1f2937; font-family: 'Malgun Gothic', sans-serif; text-align: center;
        }
        #server-lock-screen h1 { font-size: 28px; color: #ef4444; margin-bottom: 10px; }

        /* 🔒 관리자 전용 업로드 섹션 */
        .upload-section { 
            background: #f0fdf4; 
            border: 2px dashed #bbf7d0; 
            border-radius: 8px; 
            padding: 12px 15px; 
            margin-bottom: 20px; 
            display: none; 
            align-items: center; 
            justify-content: space-between; 
            flex-wrap: wrap; 
            gap: 10px; 
        }
        .upload-info { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #166534; }
        .file-label { background-color: #16a34a; color: white; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; display: inline-block; }
        #csv-file { display: none; }

        /* 지도 영역 스타일 */
        .map-section { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .map-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #374151; display: flex; justify-content: space-between; align-items: center; }
        
        .location-search-box { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; width: 100%; }
        .location-search-input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid #2563eb; border-radius: 6px; font-size: 13px; outline: none; box-sizing: border-box; }
        .btn-location-search { padding: 8px 16px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .btn-gps { padding: 8px 14px; background-color: #7c3aed; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .top-gps-msg { font-size: 12px; font-weight: bold; color: #6b21a8; margin-left: 4px; }

        #map { width: 100%; height: 420px; border-radius: 6px; border: 1px solid #d1d5db; }

        /* 🎯 말풍선(인포윈도우) 스타일 */
        .popup-wrap { background: #ffffff; padding: 6px; border-radius: 4px; }
        .popup-info-table { border-collapse: collapse; font-size: 12px; min-width: 200px; background: #ffffff; }
        .popup-info-table th { background-color: #f8fafc; color: #475569; font-weight: bold; padding: 6px; border: 1px solid #e2e8f0; text-align: left; width: 70px; }
        .popup-info-table td { padding: 6px; border: 1px solid #e2e8f0; color: #0f172a; text-align: left; font-weight: bold; }

        /* 🎨 커스텀 마커 핀 스타일 */
        .custom-pin-marker {
            position: relative; width: 24px; height: 24px; border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg); display: flex; align-items: center; justify-content: center;
            box-shadow: -1px 2px 4px rgba(0,0,0,0.3); cursor: pointer; border: 2px solid #ffffff;
        }
        .pin-gj { background-color: #153D64 !important; }
        .pin-psm-exclusive { background-color: #FF0000 !important; }
        .pin-psm-duplicate { background-color: #FFFF00 !important; border: 2px solid #cbd5e1; }
        .pin-normal { background-color: #2563EB !important; }

        /* 필터 및 테이블 스타일 */
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 20px; margin-top: 15px; }
        .filter-group { display: flex; flex-direction: column; position: relative; }
        .filter-group label { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #4b5563; }
        .search-input { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; background-color: #fff; }
        
        .dropdown-list { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #d1d5db; border-radius: 0 0 6px 6px; max-height: 180px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); z-index: 1000; display: none; margin: 0; padding: 0; list-style: none; }
        .dropdown-list li { padding: 8px 10px; cursor: pointer; font-size: 13px; }
        .dropdown-list li:hover { background-color: #f3f4f6; }
        
        .btn-group { display: flex; gap: 8px; margin-top: auto; }
        .btn-reset { flex: 1; padding: 9px; background-color: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-reset:hover { background-color: #dc2626; }

        .admin-pw-box { display: flex; align-items: center; gap: 4px; margin-left: auto; }
        .admin-pw-input { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; width: 110px; text-align: center; }

        .table-container { overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 8px; max-height: 550px; overflow-y: auto; }
        table { width: 100%; min-width: 1000px; border-collapse: collapse; font-size: 13px; text-align: center; table-layout: fixed; }
        
        th:nth-child(1), td:nth-child(1) { width: 95px; }  
        th:nth-child(2), td:nth-child(2) { width: 140px; } 
        th:nth-child(3), td:nth-child(3) { width: 85px; }  
        th:nth-child(4), td:nth-child(4) { width: auto; }   
        th:nth-child(5), td:nth-child(5) { width: 125px; } 
        th:nth-child(6), td:nth-child(6) { width: 95px; }  
        th:nth-child(7), td:nth-child(7) { width: 85px; }  
        th:nth-child(8), td:nth-child(8) { width: 105px; } 

        th, td { padding: 10px 8px; border-bottom: 1px solid #e5e7eb; box-sizing: border-box; }
        th { background-color: #f3f4f6; color: #374151; font-weight: 700; position: sticky; top: 0; z-index: 10; }
        td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        td.text-left { text-align: left; white-space: normal; word-break: break-all; } 
        tr { transition: background-color 0.2s; }
        tr:hover { background-color: #f1f5f9; }
        tr.duplicate-row { background-color: #FFFFCC; }

        .map-link { color: #2563eb; text-decoration: none; font-weight: 500; }
        .distance-tag { font-size: 11px; background-color: #f3e8ff; color: #6b21a8; padding: 2px 7px; border-radius: 20px; font-weight: bold; margin-left: 6px; }

        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; }
        .badge-total { background-color: #dcfce7; color: #166534; }  
        .badge-score { background-color: #e0f2fe; color: #0369a1; }  
        .badge-type { background-color: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; }
        .badge-gj-agency { background-color: #153D64 !important; color: #FFFF00 !important; }
        .badge-psm-agency { background-color: #FF0000 !important; color: #FFFFFF !important; }

        .info-status { font-size: 13px; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .total-count { color: #2563eb; }

        @media (max-width: 768px) {
            .filter-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .btn-group { grid-column: span 2; }
            #map { height: 320px; }
        }
    </style>
</head>
<body>

<div id="server-lock-screen">
    <h1>⚠️ 시스템 일시 점검 안내</h1>
</div>

<div class="container">
    <h2>🏢 판매점 데이터 통합 조회 시스템</h2>

    <div id="admin-upload-panel" class="upload-section">
        <div class="upload-info">
            <span>📊 <b>분석 대상 파일:</b> <span id="target-file-name" style="font-weight: bold; color: #2563eb;">전거래처_PS중복.csv</span></span>
        </div>
        <div>
            <label for="csv-file" class="file-label">📂 파일 교체</label>
            <input type="file" id="csv-file" accept=".csv" onchange="handleFileSelect(event)">
        </div>
    </div>

    <div class="map-section">
        <div class="map-title">
            <span>📍 내 기준위치 보정 및 주변 거래처 시각화</span>
            <div class="admin-pw-box">
                <input type="password" id="admin-password" class="admin-pw-input" placeholder="🔒 관리자 인증" onkeydown="if(event.keyCode === 13) checkAdminAccess();">
            </div>
        </div>
        
        <div class="location-search-box">
            <input type="text" id="map-search-keyword" class="location-search-input" placeholder="이동할 기준 장소나 주소를 입력하세요 (예: 목동역, 강남역)" onkeydown="if(event.keyCode === 13) searchNewLocation();">
            <button class="btn-location-search" onclick="searchNewLocation()">위치 이동</button>
            <button class="btn-gps" onclick="getUserLocation()">📍 현재 GPS 재수신</button>
            <span id="gps-msg" class="top-gps-msg">위치 신호를 탐색하고 있습니다...</span>
        </div>
        
        <div id="map"></div>
    </div>

    <div class="filter-grid">
        <div class="filter-group"><label>시도명</label><input type="text" id="search-sido" class="search-input" onfocus="showDropdown('sido')" oninput="filterDropdown('sido')" autocomplete="off"><ul id="sido-list" class="dropdown-list"></ul></div>
        <div class="filter-group"><label>시군구명</label><input type="text" id="search-sigungu" class="search-input" onfocus="showDropdown('sigungu')" oninput="filterDropdown('sigungu')" autocomplete="off"><ul id="sigungu-list" class="dropdown-list"></ul></div>
        <div class="filter-group"><label>읍면동명</label><input type="text" id="search-dong" class="search-input" onfocus="showDropdown('dong')" oninput="filterDropdown('dong')" autocomplete="off"><ul id="dong-list" class="dropdown-list"></ul></div>
        <div class="filter-group"><label>중복여부</label><input type="text" id="search-type" class="search-input" onfocus="showDropdown('type')" oninput="filterDropdown('type')" autocomplete="off"><ul id="type-list" class="dropdown-list"></ul></div>
        <div class="btn-group"><button class="btn-reset" onclick="resetAllFilters()">초기화</button></div>
    </div>

    <div>
        <div class="info-status"><div class="total-count">📊 조회된 판매점 목록: <span id="count">0</span>건</div></div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>P코드</th><th>거래처명</th><th>읍면동</th><th class="text-left">상세주소 (현재거리)</th><th>대리점명</th><th>중복여부</th><th>점유비</th><th>대리점실적</th></tr>
                </thead>
                <tbody id="table-body">
                    <tr><td id="status-msg" colspan="8" style="padding:30px; color:#2563eb; font-weight:bold;">🔄 데이터를 불러오는 중입니다...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
let isServerOpen = true; 
let csvData = [];
let filters = { sido: "", sigungu: "", dong: "", type: "" };
let pcodeCounts = {}; 
let userCoords = { lat: 37.5665, lng: 126.9780 }; 
let geocoder = null;
let placesService = null; 
let map = null;
let centerMarker = null;
let storeCustomOverlays = []; 
let currentOpenedInfoWindow = null; 
let dragTimeout = null;

function checkAdminAccess() {
    const pwInput = document.getElementById('admin-password');
    if (pwInput.value === 'd13225##') {
        document.getElementById('admin-upload-panel').style.display = 'flex'; 
        pwInput.disabled = true;
    } else {
        alert('올바르지 않은 비밀번호입니다.');
    }
}

function initMap() {
    const mapContainer = document.getElementById('map');
    if (!mapContainer || typeof kakao === 'undefined') return;

    map = new kakao.maps.Map(mapContainer, { center: new kakao.maps.LatLng(userCoords.lat, userCoords.lng), level: 5 });
    geocoder = new kakao.maps.services.Geocoder();
    placesService = new kakao.maps.services.Places(); 

    centerMarker = new kakao.maps.Marker({
        position: map.getCenter(),
        image: new kakao.maps.MarkerImage('https://t1.daumcdn.net/localimg/localimages/07/2018/pc/img/marker_spot.png', new kakao.maps.Size(24, 35))
    });
    centerMarker.setMap(map);

    kakao.maps.event.addListener(map, 'dragend', function() {
        if(dragTimeout) clearTimeout(dragTimeout);
        dragTimeout = setTimeout(function() {
            updateCenterCoordinates(map.getCenter(), `🎯 지도 중심점 기준으로 거리 보정됨`);
        }, 300);
    });
}

function updateCenterCoordinates(latlng, message) {
    if(!map || !centerMarker) return;
    userCoords.lat = latlng.getLat();
    userCoords.lng = latlng.getLng();
    centerMarker.setPosition(latlng);
    document.getElementById('gps-msg').textContent = message;
    
    // 📍 위치가 바뀌면 전체 거리를 다시 계산하고 목록을 바꿉니다.
    recalculateDistancesAndFetchCoordinates();
}

function searchNewLocation() {
    const keyword = document.getElementById('map-search-keyword').value.trim();
    if (!keyword) return;

    placesService.keywordSearch(keyword, function(data, status) {
        if (status === kakao.maps.services.Status.OK) {
            const moveLatLng = new kakao.maps.LatLng(data[0].y, data[0].x);
            map.setCenter(moveLatLng);
            updateCenterCoordinates(moveLatLng, `🔎 검색 위치 이동: ${data[0].place_name}`);
        } else {
            geocoder.addressSearch(keyword, function(result, addressStatus) {
                if (addressStatus === kakao.maps.services.Status.OK) {
                    const moveLatLng = new kakao.maps.LatLng(result[0].y, result[0].x);
                    map.setCenter(moveLatLng);
                    updateCenterCoordinates(moveLatLng, `🔎 검색 주소 이동: ${keyword}`);
                }
            });
        }
    });
}

// 🎯 [핵심 변경] 목록에 나온 상위 80개 데이터만 실시간 주소 변환 후 마커로 표시!
function recalculateDistancesAndFetchCoordinates() {
    // 1단계: 전체 데이터에 대해 단순 거리 계산 (haversine) 순위 매기기용
    const filteredData = csvData.filter(item => {
        return (!filters.sido || item.sido.includes(filters.sido)) &&
               (!filters.sigungu || item.sigungu.includes(filters.sigungu)) &&
               (!filters.dong || item.dong.includes(filters.dong)) &&
               (!filters.type || item.type.includes(filters.type));
    });

    // 만약 주소 기반 대략 좌표가 있다면 갱신
    filteredData.forEach(item => {
        if (item.lat && item.lng) {
            item.distance = getDistanceHaversine(userCoords.lat, userCoords.lng, item.lat, item.lng);
        } else {
            item.distance = 999; // 미변환 시 우선순위 뒤로
        }
    });

    // 거리 순 정렬
    filteredData.sort((a, b) => a.distance - b.distance);

    // 2단계: 목록에 나올 상위 80개만 핀포인트로 정확하게 주소->좌표 변환 후 마커 생성
    const targetStores = filteredData.slice(0, 80);
    let convertedCount = 0;

    if(targetStores.length === 0) {
        renderTableAndMarkers(filteredData, []);
        return;
    }

    targetStores.forEach(item => {
        const fullAddr = `${item.sido} ${item.sigungu} ${item.address}`.trim();
        geocoder.addressSearch(fullAddr, function(result, status) {
            if (status === kakao.maps.services.Status.OK) {
                item.lat = parseFloat(result[0].y); 
                item.lng = parseFloat(result[0].x); 
                item.distance = getDistanceHaversine(userCoords.lat, userCoords.lng, item.lat, item.lng);
            }
            convertedCount++;
            
            if(convertedCount === targetStores.length) {
                // 모두 변환되면 정렬 재수행 후 화면 표시
                filteredData.sort((a, b) => a.distance - b.distance);
                renderTableAndMarkers(filteredData, targetStores);
            }
        });
    });
}

function renderTableAndMarkers(allData, markerData) {
    // 1. 지도 마커 지우고 새로 그리기
    storeCustomOverlays.forEach(overlay => overlay.setMap(null));
    storeCustomOverlays = [];
    if (currentOpenedInfoWindow) currentOpenedInfoWindow.close();

    markerData.forEach(store => {
        if (!store.lat || !store.lng) return;

        const markerPosition = new kakao.maps.LatLng(store.lat, store.lng);
        const isGJ = store.agency.includes('광장대리점');
        const isPSM = store.agency.toUpperCase().includes('PS&M') || store.agency.includes('피에스앤마케팅');
        
        let pinClass = "pin-normal";
        if (isGJ) pinClass = "pin-gj"; 
        else if (isPSM && store.type === 'PS_전속') pinClass = "pin-psm-exclusive"; 
        else if (isPSM && store.type === '중복점') pinClass = "pin-psm-duplicate";

        const contentEl = document.createElement('div');
        contentEl.className = `custom-pin-marker ${pinClass}`;

        const customOverlay = new kakao.maps.CustomOverlay({ position: markerPosition, content: contentEl, yAnchor: 1.0, xAnchor: 0.5 });
        customOverlay.setMap(map);
        storeCustomOverlays.push(customOverlay);

        const iwContent = `
            <div class="popup-wrap">
                <table class="popup-info-table">
                    <tr><th>판매점 명</th><td>${store.name}</td></tr>
                    <tr><th>대리점 명</th><td>${store.agency || '정보없음'}</td></tr>
                    <tr><th>중복여부</th><td>${store.type}</td></tr>
                    <tr><th>대리점실적</th><td>${store.score.toLocaleString()}건</td></tr>
                </table>
            </div>`;

        const infowindow = new kakao.maps.InfoWindow({ content: iwContent, removable: true });
        contentEl.addEventListener('click', function() {
            if (currentOpenedInfoWindow) currentOpenedInfoWindow.close();
            infowindow.open(map, customOverlay);
            currentOpenedInfoWindow = infowindow;
        });
    });

    // 2. 하단 테이블 목록 그리기
    const tbody = document.getElementById('table-body');
    document.getElementById('count').textContent = allData.length.toLocaleString();
    tbody.innerHTML = '';

    const limitData = allData.slice(0, 80);
    limitData.forEach(item => {
        const fullAddress = `${item.sido} ${item.sigungu} ${item.address}`.trim();
        const kakaoMapUrl = `https://map.kakao.com/link/search/${encodeURIComponent(fullAddress)}`;
        const classAttr = pcodeCounts[item.pcode] > 1 ? 'class="duplicate-row"' : '';
        
        const isGJ = item.agency.includes('광장대리점');
        const isPSM = item.agency.toUpperCase().includes('PS&M') || item.agency.includes('피에스앤마케팅');
        let agencyBadgeClass = `badge ${isGJ ? 'badge-gj-agency' : isPSM ? 'badge-psm-agency' : 'badge-type'}`;

        let distanceTxt = item.distance < 900 ? (item.distance < 1 ? `<span class="distance-tag">📍 ${(item.distance * 1000).toFixed(0)} m</span>` : `<span class="distance-tag">📍 ${item.distance.toFixed(2)} km</span>`) : '';

        tbody.innerHTML += `
            <tr id="row-${item.pcode}" ${classAttr}>
                <td><b>${item.pcode}</b></td>
                <td><b>${item.name}</b></td>
                <td>${item.dong}</td>
                <td class="text-left"><a href="${kakaoMapUrl}" target="_blank" class="map-link">📍 ${item.address}</a>${distanceTxt}</td>
                <td><span class="${agencyBadgeClass}">${item.agency}</span></td>
                <td><span class="badge badge-type">${item.type}</span></td>
                <td><span class="badge badge-score">${item.ratio.toFixed(1)}%</span></td>
                <td><span class="badge badge-total">${item.score.toLocaleString()}</span></td>
            </tr>`;
    });
}

window.onload = function() {
    if (!isServerOpen) return;
    initMap();
    getUserLocation();

    const targetFileUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/전거래처_PS중복.csv';
    fetch(targetFileUrl)
    .then(res => res.blob())
    .then(blob => { parseCSVFile(blob); })
    .catch(() => { document.getElementById('status-msg').innerHTML = `⚠️ 서버 데이터 로드 실패`; });
};

function getUserLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            userCoords = { lat: position.coords.latitude, lng: position.coords.longitude };
            document.getElementById('gps-msg').textContent = `✅ GPS 수신 완료`;
            if(map) {
                const newPos = new kakao.maps.LatLng(userCoords.lat, userCoords.lng);
                map.setCenter(newPos);
                centerMarker.setPosition(newPos);
            }
            if(csvData.length > 0) recalculateDistancesAndFetchCoordinates();
        });
    }
}

function getDistanceHaversine(lat1, lng1, lat2, lng2) {
    const r = 6371; 
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return r * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

function parseCSVFile(fileOrBlob) {
    Papa.parse(fileOrBlob, {
        header: false, skipEmptyLines: true, encoding: "UTF-8", 
        complete: function(results) {
            let rows = results.data;
            const sample = rows.slice(0, 5).map(r => r.join('')).join('');
            if (sample.includes('거래처명') === false && sample.match(/[ㄱ-ㅎㅏ-ㅣ가-힣]/) === null) {
                Papa.parse(fileOrBlob, { header: false, skipEmptyLines: true, encoding: "EUC-KR", complete: function(euc) { processRows(euc.data); } });
            } else {
                processRows(rows);
            }
        }
    });
}

function processRows(rows) {
    const headerRow = rows[0].map(h => h ? h.toString().trim().replace(/\s+/g, '') : '');
    pcodeCounts = {};

    csvData = rows.slice(1).map(row => {
        if (!row || row.length < 2 || !row[1]) return null;
        const pcodeVal = row[1].toString().trim();
        pcodeCounts[pcodeVal] = (pcodeCounts[pcodeVal] || 0) + 1;
        
        const score = parseInt(row[9]?.toString().replace(/,/g, '')) || 0;
        const total = parseInt(row[10]?.toString().replace(/,/g, '')) || 0;

        return {
            pcode: pcodeVal, name: row[2] || '', sido: row[3] || '', sigungu: row[4] || '', dong: row[5] || '', address: row[6] || '', agency: row[7] || '', type: row[8] || '정보없음',
            score: score, ratio: total > 0 ? (score / total) * 100 : 0, lat: 0, lng: 0, distance: 999
        };
    }).filter(Boolean);

    initFilters();
    recalculateDistancesAndFetchCoordinates();
}

function initFilters() {
    ['sido', 'sigungu', 'dong', 'type'].forEach(k => buildDropdown(k, csvData));
}

function buildDropdown(key, data) {
    const listEl = document.getElementById(`${key}-list`);
    const uniqueValues = [...new Set(data.map(item => item[key]))].filter(Boolean).sort();
    listEl.innerHTML = `<li onclick="selectValue('${key}', '')">-- 전체 --</li>`;
    uniqueValues.forEach(val => {
        const li = document.createElement('li');
        li.textContent = val;
        li.onclick = function() { selectValue(key, val); };
        listEl.appendChild(li);
    });
}

function showDropdown(key) {
    document.querySelectorAll('.dropdown-list').forEach(el => el.style.display = 'none');
    document.getElementById(`${key}-list`).style.display = 'block';
}

function selectValue(key, val) {
    filters[key] = val;
    document.getElementById(`search-${key}`).value = val;
    document.getElementById(`${key}-list`).style.display = 'none';
    applyFilters();
}

function filterDropdown(key) {
    const input = document.getElementById(`search-${key}`).value.toLowerCase();
    if(input === "") filters[key] = "";
    document.querySelectorAll(`#${key}-list li`).forEach((li, idx) => {
        if(idx !== 0) li.style.display = li.textContent.toLowerCase().includes(input) ? 'block' : 'none';
    });
    applyFilters();
}

function applyFilters() {
    recalculateDistancesAndFetchCoordinates();
}

function resetAllFilters() {
    filters = { sido: "", sigungu: "", dong: "", type: "" };
    ['sido', 'sigungu', 'dong', 'type'].forEach(k => document.getElementById(`search-${k}`).value = "");
    recalculateDistancesAndFetchCoordinates();
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.filter-group')) document.querySelectorAll('.dropdown-list').forEach(el => el.style.display = 'none');
});
</script>

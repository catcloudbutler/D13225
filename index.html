<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지역별 판매점 데이터 통합 복합 검색 필터 시스템</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f3f4f6; color: #1f2937; }
        .container { max-width: 1400px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #111827; margin-bottom: 25px; }

        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 25px; }
        .filter-group { display: flex; flex-direction: column; position: relative; }
        .filter-group label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #4b5563; }
        .search-input { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; box-sizing: border-box; width: 100%; background-color: #fff; }
        
        .dropdown-list { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #d1d5db; border-radius: 0 0 6px 6px; max-height: 180px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); z-index: 1000; display: none; margin: 0; padding: 0; list-style: none; }
        .dropdown-list li { padding: 10px 12px; cursor: pointer; font-size: 14px; }
        .dropdown-list li:hover { background-color: #f3f4f6; }
        .btn-reset { padding: 10px; background-color: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: auto; }
        .btn-reset:hover { background-color: #dc2626; }

        .table-container { overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 8px; max-height: 600px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #e5e7eb; }
        th { background-color: #f3f4f6; color: #374151; font-weight: 700; position: sticky; top: 0; z-index: 10; }
        tr:hover { background-color: #f9fafb; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-total { background-color: #e0f2fe; color: #0369a1; }
        .badge-score { background-color: #dcfce7; color: #166534; }
        .badge-type { background-color: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; }
        .text-left { text-align: left; }
        .total-count { font-size: 16px; font-weight: bold; color: #2563eb; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏢 판매점 데이터 통합 조회 시스템</h2>

    <div class="filter-grid">
        <div class="filter-group">
            <label>시도명 검색</label>
            <input type="text" id="search-sido" class="search-input" placeholder="🔍 시도명 입력" onfocus="showDropdown('sido')" oninput="filterDropdown('sido')" autocomplete="off">
            <ul id="sido-list" class="dropdown-list"></ul>
        </div>
        <div class="filter-group">
            <label>시군구명 검색</label>
            <input type="text" id="search-sigungu" class="search-input" placeholder="🔍 시군구명 입력" onfocus="showDropdown('sigungu')" oninput="filterDropdown('sigungu')" autocomplete="off">
            <ul id="sigungu-list" class="dropdown-list"></ul>
        </div>
        <div class="filter-group">
            <label>읍면동명 검색</label>
            <input type="text" id="search-dong" class="search-input" placeholder="🔍 읍면동명 입력" onfocus="showDropdown('dong')" oninput="filterDropdown('dong')" autocomplete="off">
            <ul id="dong-list" class="dropdown-list"></ul>
        </div>
        <div class="filter-group">
            <label>중복여부 검색</label>
            <input type="text" id="search-type" class="search-input" placeholder="🔍 중복여부 선택" onfocus="showDropdown('type')" oninput="filterDropdown('type')" autocomplete="off">
            <ul id="type-list" class="dropdown-list"></ul>
        </div>
        <button class="btn-reset" onclick="resetAllFilters()">필터 초기화</button>
    </div>

    <div>
        <div class="total-count">
            📊 조회된 판매점 목록: <span id="count">0</span>건
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>P코드</th>
                        <th>거래처명</th>
                        <th>시도</th>
                        <th>시군구</th>
                        <th>읍면동</th>
                        <th class="text-left">상세주소</th>
                        <th>대리점명</th>
                        <th>중복여부</th>
                        <th>실적</th>
                        <th>P코드합계</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td id="status-msg" colspan="10" style="padding:30px; color:#2563eb; font-weight:bold;">🔄 저장소로부터 새 데이터 파일(전거래처_PS중복.csv)을 자동 동기화 중입니다...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
!function(e,t){"function"==typeof define&&define.amd?define([],t):"object"==typeof exports?module.exports=t():e.Papa=t()}(this,function(){"use strict";function e(e,t){var r=arguments.length>2&&void 0!==arguments[2]?arguments[2]:{};if("function"==typeof t&&(t={complete:t}),"object"!=typeof t&&(t={}),(t=Object.assign({},i,t)).beforeFirstChunk&&(e=t.beforeFirstChunk(e)),"string"==typeof e)return t.worker?new n(t).parse(e,r):new o(t).parse(e);if(e instanceof File||e instanceof Blob){if(t.worker)return new n(t).parse(e,r);var a=new o(t);return r.unpause=function(){a.resume()},a.parse(e)}return new o(t).parse(e)}var t="undefined"!=typeof window?window:"undefined"!=typeof global?global:"undefined"!=typeof self?self:{},i={delimiter:"",newline:"",quoteChar:'"',escapeChar:'"',header:!1,transformHeader:void 0,dynamicTyping:!1,preview:0,encoding:"EUC-KR",worker:!1,comments:!1,step:void 0,complete:void 0,error:void 0,download:!1,downloadRequest:void 0,skipEmptyLines:!1,chunk:void 0,fastMode:!1,beforeFirstChunk:void 0,transform:void 0,delimitersToGuess:[",","\t","|",";"]};function o(e){this._config=e,this._parser=null,this._stream=null,this._encoding=e.encoding,this._paused=!1}function n(e){this._config=e}return o.prototype.parse=function(e){if(e instanceof File||e instanceof Blob){var t=new FileReader;t.onload=function(r){var a=r.target.result;this._parser=new r(this._config),this._parser.parse(a)},t.readAsText(e,this._encoding)}else this._parser=new r(this._config),this._parser.parse(e)},o.prototype.resume=function(){this._paused=!1,this._stream&&this._stream.resume()},e});

let csvData = [];
let filters = { sido: "", sigungu: "", dong: "", type: "" };

// 🌐 새 파일명 '전거래처_PS중복.csv' 주소를 자동으로 동기화합니다.
window.onload = function() {
    fetch('전거래처_PS중복.csv')
    .then(res => {
        if(!res.ok) throw new Error("파일을 찾을 수 없습니다.");
        return res.arrayBuffer(); 
    })
    .then(buffer => {
        const decoder = new TextDecoder('euc-kr');
        const csvText = decoder.decode(buffer);
        
        Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                csvData = results.data.map(row => ({
                    pcode: row['P코드'] || '',
                    name: row['거래처명'] || '',
                    sido: row['시도명'] || '',
                    sigungu: row['시군구명'] || '',
                    dong: row['읍면동명'] || '',
                    address: row['주소'] || '공백/데이터없음',
                    agency: row['대리점명'] || '',
                    type: row['중복여부'] || '정보없음',
                    score: parseInt((row['실적'] || '0').replace(/,/g, '')) || 0,
                    total_score: parseInt((row['P코드합계'] || '0').replace(/,/g, '')) || 0
                })).filter(item => item.pcode);

                initFilters();
            }
        });
    })
    .catch(err => {
        document.getElementById('status-msg').innerHTML = `<span style="color:#ef4444;">⚠️ 자동 연결 실패: 깃허브 저장소에 새 이름인 '전거래처_PS중복.csv' 파일이 index.html과 같은 위치에 업로드되어 있는지 확인해 주세요.</span>`;
    });
};

function initFilters() {
    buildDropdown('sido', csvData);
    buildDropdown('sigungu', csvData);
    buildDropdown('dong', csvData);
    buildDropdown('type', csvData);
    renderTable(csvData);
}

function buildDropdown(key, data) {
    const listEl = document.getElementById(`${key}-list`);
    const uniqueValues = [...new Set(data.map(item => item[key]))].filter(Boolean).sort();
    
    listEl.innerHTML = `<li onclick="selectValue('${key}', '')">-- 전체 --</li>`;
    uniqueValues.forEach(val => {
        const li = document.createElement('li');
        li.textContent = val;
        li.onclick = function() { selectValue(key, val); };
        listEl.appendChild(li);
    });
}

function showDropdown(key) {
    document.querySelectorAll('.dropdown-list').forEach(el => el.style.display = 'none');
    document.getElementById(`${key}-list`).style.display = 'block';
}

function selectValue(key, val) {
    filters[key] = val;
    document.getElementById(`search-${key}`).value = val;
    document.getElementById(`${key}-list`).style.display = 'none';
    applyFilters(key);
}

function filterDropdown(key) {
    const input = document.getElementById(`search-${key}`).value.toLowerCase();
    const items = document.querySelectorAll(`#${key}-list li`);
    if(input === "") filters[key] = "";
    items.forEach((li, index) => {
        if(index === 0) return;
        const text = li.textContent.toLowerCase();
        li.style.display = text.includes(input) ? 'block' : 'none';
    });
    applyFilters(key);
}

function applyFilters(changedKey) {
    const filteredData = csvData.filter(item => {
        return (!filters.sido || item.sido.includes(filters.sido)) &&
               (!filters.sigungu || item.sigungu.includes(filters.sigungu)) &&
               (!filters.dong || item.dong.includes(filters.dong)) &&
               (!filters.type || item.type.includes(filters.type));
    });

    const keys = ['sido', 'sigungu', 'dong', 'type'];
    keys.forEach(k => {
        if (k !== changedKey && !filters[k]) {
            buildDropdown(k, filteredData);
        }
    });
    renderTable(filteredData);
}

function renderTable(data) {
    const tbody = document.getElementById('table-body');
    document.getElementById('count').textContent = data.length.toLocaleString();
    tbody.innerHTML = '';

    if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" style="color:#ef4444; padding:30px; font-weight:bold;">일치하는 조건의 데이터가 존재하지 않습니다.</td></tr>`;
        return;
    }

    const limitData = data.slice(0, 500); 
    limitData.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td><b>${item.pcode}</b></td>
                <td><b>${item.name}</b></td>
                <td>${item.sido}</td>
                <td>${item.sigungu}</td>
                <td>${item.dong}</td>
                <td class="text-left" style="color: #2563eb;">${item.address}</td>
                <td>${item.agency}</td>
                <td><span class="badge badge-type">${item.type}</span></td>
                <td><span class="badge badge-score">${item.score.toLocaleString()}</span></td>
                <td><span class="badge badge-total">${item.total_score.toLocaleString()}</span></td>
            </tr>
        `;
    });

    if (data.length > 500) {
        tbody.innerHTML += `<tr><td colspan="10" style="padding:15px; background:#f3f4f6; color:#4b5563; font-weight:bold;">⚠️ 데이터가 너무 많아 상위 500개만 화면에 표시 중입니다. 필터를 이용해 범위를 좁혀주세요.</td></tr>`;
    }
}

function resetAllFilters() {
    filters = { sido: "", sigungu: "", dong: "", type: "" };
    document.getElementById('search-sido').value = "";
    document.getElementById('search-sigungu').value = "";
    document.getElementById('search-dong').value = "";
    document.getElementById('search-type').value = "";
    if(csvData.length > 0) initFilters();
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.filter-group')) {
        document.querySelectorAll('.dropdown-list').forEach(el => el.style.display = 'none');
    }
});
</script>
</body>
</html>

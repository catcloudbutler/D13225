<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>지역별 판매점 데이터 통합 복합 검색 필터 시스템 (오류 완벽 수정 버전)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=47d0f2bd29fbb279cb461bdad2cf1097&libraries=services,clusterer"></script>
    
    <style>
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            padding: 15px; 
            background-color: #f3f4f6; 
            color: #1f2937; 
            margin: 0; 
            -webkit-user-select: none;  
            -moz-user-select: none;     
            -ms-user-select: none;      
            user-select: none;          
        }
        .container { max-width: 1400px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #111827; margin-bottom: 20px; font-size: 20px; }

        #server-lock-screen {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; z-index: 99999;
            flex-direction: column; align-items: center; justify-content: center;
            color: #1f2937; font-family: 'Malgun Gothic', sans-serif; text-align: center;
        }

        .upload-section { 
            background: #f0fdf4; 
            border: 2px dashed #bbf7d0; 
            border-radius: 8px; 
            padding: 12px 15px; 
            margin-bottom: 20px; 
            display: none; 
            align-items: center; 
            justify-content: space-between; 
            flex-wrap: wrap; 
            gap: 10px; 
        }
        .upload-info { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #166534; }
        .upload-info b { color: #15803d; }
        .file-label { background-color: #16a34a; color: white; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; display: inline-block; transition: background 0.2s; white-space: nowrap; }
        .file-label:hover { background-color: #15803d; }
        #csv-file { display: none; }

        .map-section { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .map-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #374151; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        .location-search-box { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; width: 100%; }
        .location-search-input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid #2563eb; border-radius: 6px; font-size: 13px; outline: none; box-sizing: border-box; width: 100%; background-color: #fff; }
        .btn-location-search { padding: 8px 16px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .btn-location-search:hover { background-color: #1d4ed8; }
        
        .btn-gps { padding: 8px 14px; background-color: #7c3aed; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap; }
        .btn-gps:hover { background-color: #6d28d9; }
        .top-gps-msg { font-size: 12px; font-weight: bold; color: #6b21a8; margin-left: 4px; display: inline-block; white-space: nowrap; }

        #map { width: 100%; height: 420px; border-radius: 6px; border: 1px solid #d1d5db; }

        /* 내 위치 핀 위에 뜨는 라벨 스타일 */
        .my-gps-label {
            position: relative;
            bottom: 50px;
            border-radius: 15px;
            border: 2px solid #ef4444;
            background-color: #ef4444;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .my-gps-label::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #ef4444 transparent;
            display: block;
            width: 0;
        }

        .custom-iw-container {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            width: 245px;          
            max-height: 240px;     
            overflow-y: auto;
            overflow-x: hidden;    
            box-sizing: border-box;
        }
        .popup-store-block {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #cbd5e1;
        }
        .popup-store-block:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .popup-item-row {
            display: flex;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 2px;
        }
        .popup-item-row .label {
            width: 65px;
            font-weight: bold;
            color: #475569;
            flex-shrink: 0;
        }
        .popup-item-row .value {
            color: #0f172a;
            word-break: break-all;
            white-space: normal;
        }

        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 20px; margin-top: 15px; }
        .filter-group { display: flex; flex-direction: column; position: relative; }
        .filter-group label { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #4b5563; }
        .search-input { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; box-sizing: border-box; width: 100%; background-color: #fff; }
        
        .dropdown-list { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #d1d5db; border-radius: 0 0 6px 6px; max-height: 180px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); z-index: 1000; display: none; margin: 0; padding: 0; list-style: none; }
        .dropdown-list li { padding: 8px 10px; cursor: pointer; font-size: 13px; }
        .dropdown-list li:hover { background-color: #f3f4f6; }
        
        .btn-group { display: flex; gap: 8px; margin-top: auto; }
        .btn-reset { flex: 1; padding: 9px; background-color: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap; }
        .btn-reset:hover { background-color: #dc2626; }

        .admin-pw-box { display: flex; align-items: center; gap: 4px; margin-left: auto; }
        .admin-pw-input { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; width: 110px; outline: none; text-align: center; transition: all 0.2s; }
        .admin-pw-input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }

        .table-container { overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 8px; max-height: 550px; overflow-y: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        table { width: 100%; min-width: 1000px; border-collapse: collapse; font-size: 13px; text-align: center; table-layout: fixed; }
        
        th:nth-child(1), td:nth-child(1) { width: 95px; }  
        th:nth-child(2), td:nth-child(2) { width: 140px; } 
        th:nth-child(3), td:nth-child(3) { width: 85px; }  
        th:nth-child(4), td:nth-child(4) { width: auto; }   
        th:nth-child(5), td:nth-child(5) { width: 125px; } 
        th:nth-child(6), td:nth-child(6) { width: 105px; }  
        th:nth-child(7), td:nth-child(7) { width: 85px; }  
        th:nth-child(8), td:nth-child(8) { width: 105px; } 

        th, td { padding: 10px 8px; border-bottom: 1px solid #e5e7eb; box-sizing: border-box; }
        th { background-color: #f3f4f6; color: #374151; font-weight: 700; position: sticky; top: 0; z-index: 10; }
        td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        td.text-left { text-align: left; white-space: normal; word-break: break-all; } 
        tr { transition: background-color 0.2s; }
        tr:hover { background-color: #f1f5f9; }
        
        tr.duplicate-row { background-color: #FFFFCC; }
        tr.duplicate-row:hover { background-color: #fef08a !important; }

        .map-link { color: #2563eb; text-decoration: none; font-weight: 500; display: inline-block; vertical-align: middle; }
        .map-link:hover { text-decoration: underline; color: #1d4ed8; }
        
        .distance-tag { font-size: 11px; background-color: #f3e8ff; color: #6b21a8; padding: 2px 7px; border-radius: 20px; font-weight: bold; margin-left: 6px; display: inline-block; vertical-align: middle; white-space: nowrap; }

        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; }
        .badge-total { background-color: #dcfce7; color: #166534; }  
        .badge-score { background-color: #e0f2fe; color: #0369a1; }  
        .badge-type { background-color: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; }

        /* 대리점별 전용 강조 배지 */
        .badge-gj-agency { background-color: #153D64 !important; color: #FFFF00 !important; border: none; }
        .badge-psm-agency { background-color: #FF0000 !important; color: #FFFFFF !important; border: none; }

        .info-status { font-size: 13px; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .total-count { color: #2563eb; }

        .kakaomap-iw-wrapper { padding: 0; background: transparent; }
        .kakaomap-iw-wrapper * { box-sizing: border-box; }

        @media (max-width: 768px) {
            body { padding: 8px; }
            .container { padding: 12px; border-radius: 8px; }
            h2 { font-size: 17px; margin-bottom: 15px; }
            
            .custom-iw-container { width: 215px !important; max-height: 200px !important; padding: 8px 10px !important; }
            .popup-item-row { font-size: 11px !important; }
            .popup-item-row .label { width: 60px !important; }

            .location-search-box { gap: 6px; }
            .location-search-input { width: 100%; flex: none; }
            .btn-location-search { flex: 1; text-align: center; }
            .btn-gps { flex: 1; text-align: center; }
            .top-gps-msg { block; width: 100%; margin-left: 0; margin-top: 4px; text-align: left; font-size: 11px; }
            
            .filter-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px; }
            .btn-group { grid-column: span 2; margin-top: 5px; }
            .map-title { flex-direction: column; align-items: flex-start; gap: 6px; }
            .admin-pw-box { margin-left: 0; width: 100%; display: flex; justify-content: flex-start; }
            table { font-size: 12px; min-width: 1050px; } 
            th, td { padding: 8px 5px; }
            .badge { font-size: 10px; padding: 2px 4px; }
            .distance-tag { font-size: 10px; padding: 1px 5px; }
            #map { height: 320px; }
        }
    </style>
</head>
<body>

<div id="server-lock-screen">
    <h1>⚠️ 시스템 일시 점검 안내</h1>
    <p>현재 데이터베이스 및 관리 시스템 점검으로 인해 서비스를 이용하실 수 없습니다.</p>
</div>

<div class="container">
    <h2>🏢 판매점 데이터 통합 조회 시스템</h2>

    <div id="admin-upload-panel" class="upload-section">
        <div class="upload-info">
            <span>📊 <b>분석 대상 파일:</b> <span id="target-file-name" style="font-weight: bold; color: #2563eb;">전거래처_PS중복.csv (서버 자동 연동)</span></span>
        </div>
        <div>
            <label for="csv-file" class="file-label">📂 다른 파일 첨부/교체</label>
            <input type="file" id="csv-file" accept=".csv" onchange="handleFileSelect(event)">
        </div>
    </div>

    <div class="map-section">
        <div class="map-title">
            <div><span>📍 내 기준위치 보정 및 주변 거래처 시각화</span></div>
            <div class="admin-pw-box">
                <input type="password" id="admin-password" class="admin-pw-input" placeholder="🔒 관리자 인증" onkeydown="if(event.keyCode === 13) checkAdminAccess();">
            </div>
        </div>
        
        <div class="location-search-box">
            <input type="text" id="map-search-keyword" class="location-search-input" placeholder="이동할 기준 장소나 주소를 입력하세요 (예: 강남역, 대전시청)" onkeydown="if(event.keyCode === 13) searchNewLocation();">
            <button class="btn-location-search" onclick="searchNewLocation()">위치 이동</button>
            <button class="btn-gps" onclick="getUserLocation()">📍 현재 GPS 재수신</button>
            <span id="gps-msg" class="top-gps-msg">위치 신호를 탐색하고 있습니다...</span>
        </div>
        
        <div id="map"></div>
    </div>

    <div class="filter-grid" id="filter-area">
        <div class="filter-group">
            <label>시도명 검색</label>
            <input type="text" id="search-sido" class="search-input" placeholder="🔍 시도명 입력" onfocus="showDropdown('sido')" oninput="filterDropdown('sido')" autocomplete="off">
            <ul id="sido-list" class="dropdown-list"></ul>
        </div>
        <div class="filter-group">
            <label>시군구명 검색</label>
            <input type="text" id="search-sigungu" class="search-input" placeholder="🔍 시군구명 입력" onfocus="showDropdown('sigungu')" oninput="filterDropdown('sigungu')" autocomplete="off">
            <ul id="sigungu-list" class="dropdown-list"></ul>
        </div>
        <div class="filter-group">
            <label>읍면동명 검색</label>
            <input type="text" id="search-dong" class="search-input" placeholder="🔍 읍면동명 입력" onfocus="showDropdown('dong')" oninput="filterDropdown('dong')" autocomplete="off">
            <ul id="dong-list" class="dropdown-list"></ul>
        </div>
        <div class="filter-group">
            <label>중복여부 검색</label>
            <input type="text" id="search-type" class="search-input" placeholder="🔍 중복여부 선택" onfocus="showDropdown('type')" oninput="filterDropdown('type')" autocomplete="off">
            <ul id="type-list" class="dropdown-list"></ul>
        </div>
        <div class="btn-group">
            <button class="btn-reset" onclick="resetAllFilters()">필터 초기화</button>
        </div>
    </div>

    <div>
        <div class="info-status">
            <div class="total-count">📊 조회된 판매점 목록: <span id="count">0</span>건</div>
        </div>
        <div class="table-container" id="main-table-container">
            <table>
                <thead>
                    <tr>
                        <th>P코드</th>
                        <th>거래처명</th>
                        <th>읍면동</th>
                        <th class="text-left">상세주소 (현재거리)</th>
                        <th>대리점코드</th>
                        <th>대리점명</th>
                        <th>점유비</th>
                        <th>대리점실적</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td id="status-msg" colspan="8" style="padding:30px; color:#2563eb; font-weight:bold;">🔄 서버에서 데이터를 연동하는 중입니다...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
let isServerOpen = true; 
let csvData = [];
let coordMap = {}; 
let filters = { sido: "", sigungu: "", dong: "", type: "" };
let pcodeCounts = {}; 
let userCoords = { lat: 37.5665, lng: 126.9780 }; 
let geocoder = null;
let placesService = null; 
let map = null;
let centerMarker = null;
let centerOverlay = null; 
let clusterer = null; 
let currentOpenedInfoWindow = null; 
let dragTimeout = null; 

function checkAdminAccess() {
    const pwInput = document.getElementById('admin-password');
    const uploadPanel = document.getElementById('admin-upload-panel');
    if (pwInput.value === 'd13225##') {
        uploadPanel.style.display = 'flex'; 
        pwInput.style.borderColor = '#16a34a';
        pwInput.style.backgroundColor = '#f0fdf4';
        pwInput.style.color = '#166534';
        pwInput.disabled = true; 
        pwInput.placeholder = "🔓 관리자";
    } else {
        alert('올바르지 않은 비밀번호입니다.');
        pwInput.value = ''; pwInput.focus();
    }
}

function initMap() {
    const mapContainer = document.getElementById('map');
    if (!mapContainer || typeof kakao === 'undefined') return;

    map = new kakao.maps.Map(mapContainer, {
        center: new kakao.maps.LatLng(userCoords.lat, userCoords.lng),
        level: 3 
    });
    geocoder = new kakao.maps.services.Geocoder();
    placesService = new kakao.maps.services.Places(); 

    clusterer = new kakao.maps.MarkerClusterer({
        map: map, 
        averageCenter: true, 
        minLevel: 6, 
        disableClickZoom: false 
    });

    const centerMarkerImage = new kakao.maps.MarkerImage(
        'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png', 
        new kakao.maps.Size(31, 35), 
        { offset: new kakao.maps.Point(15, 35) }
    );

    centerMarker = new kakao.maps.Marker({
        position: map.getCenter(),
        image: centerMarkerImage,
        zIndex: 10 
    });
    centerMarker.setMap(map);

    const overlayContent = '<div class="my-gps-label">🎯 내 기준위치</div>';
    centerOverlay = new kakao.maps.CustomOverlay({
        position: map.getCenter(),
        content: overlayContent,
        yAnchor: 1 
    });
    centerOverlay.setMap(map);

    kakao.maps.event.addListener(map, 'dragend', function() {
        if(dragTimeout) clearTimeout(dragTimeout);
        dragTimeout = setTimeout(function() {
            updateCenterCoordinates(map.getCenter(), `🎯 지도 중심점 기준으로 거리 보정됨`);
        }, 300);
    });
}

function updateCenterCoordinates(latlng, message) {
    if(!map || !centerMarker || !centerOverlay) return;
    userCoords.lat = latlng.getLat();
    userCoords.lng = latlng.getLng();
    
    centerMarker.setPosition(latlng);
    centerOverlay.setPosition(latlng);

    document.getElementById('gps-msg').textContent = message;
    document.getElementById('gps-msg').style.color = "#2563eb";
    recalculateDistances();
    applyFilters();
}

function searchNewLocation() {
    const keyword = document.getElementById('map-search-keyword').value.trim();
    if (!keyword) return alert('이동할 장소나 주소를 입력해 주세요.');

    placesService.keywordSearch(keyword, function(data, status) {
        if (status === kakao.maps.services.Status.OK) {
            const moveLatLng = new kakao.maps.LatLng(data[0].y, data[0].x);
            map.setCenter(moveLatLng);
            updateCenterCoordinates(moveLatLng, `🔎 검색 위치 이동: ${data[0].place_name}`);
        } else {
            geocoder.addressSearch(keyword, function(result, addressStatus) {
                if (addressStatus === kakao.maps.services.Status.OK) {
                    const moveLatLng = new kakao.maps.LatLng(result[0].y, result[0].x);
                    map.setCenter(moveLatLng);
                    updateCenterCoordinates(moveLatLng, `🔎 검색 주소 이동: ${keyword}`);
                } else {
                    alert('입력하신 장소나 주소를 찾을 수 없습니다.');
                }
            });
        }
    });
}

function displayStoreMarkersOnMap(data) {
    if (!clusterer) return;
    clusterer.clear(); 
    if (currentOpenedInfoWindow) { currentOpenedInfoWindow.close(); currentOpenedInfoWindow = null; }
    if (!map || data.length === 0) return;

    const locationGroups = {};
    data.filter(item => item.lat && item.lng).forEach(store => {
        const coordKey = `${store.lat.toFixed(5)}_${store.lng.toFixed(5)}`;
        if (!locationGroups[coordKey]) locationGroups[coordKey] = { lat: store.lat, lng: store.lng, stores: [] };
        locationGroups[coordKey].stores.push(store);
    });

    const newMarkers = [];

    Object.keys(locationGroups).forEach(key => {
        const group = locationGroups[key];
        const markerPosition = new kakao.maps.LatLng(group.lat, group.lng);
        const mergedStoreMap = {};

        group.stores.forEach(s => {
            const nameKey = s.name.trim();
            if (!mergedStoreMap[nameKey]) mergedStoreMap[nameKey] = { name: nameKey, agencies: [], codes: [], totalScore: 0 };
            if (s.agency && !mergedStoreMap[nameKey].agencies.includes(s.agency)) mergedStoreMap[nameKey].agencies.push(s.agency);
            if (s.pcode && !mergedStoreMap[nameKey].codes.includes(s.pcode)) mergedStoreMap[nameKey].codes.push(s.pcode);
            mergedStoreMap[nameKey].totalScore += s.score;
        });

        const marker = new kakao.maps.Marker({ position: markerPosition, clickable: true });
        newMarkers.push(marker);

        let innerHTMLBlocks = '';
        Object.values(mergedStoreMap).forEach(merged => {
            innerHTMLBlocks += `
                <div class="popup-store-block">
                    <div class="popup-item-row"><span class="label">거래처명</span><span class="value" style="font-weight:bold;">${merged.name}</span></div>
                    <div class="popup-item-row"><span class="label">대리점명</span><span class="value" style="font-weight:bold; color:#1e40af;">${merged.agencies.join(', ') || '정보없음'}</span></div>
                    <div class="popup-item-row"><span class="label">대리점실적</span><span class="value" style="font-weight:bold; color:#16a34a;">${merged.totalScore.toLocaleString()}건</span></div>
                </div>`;
        });

        const infowindow = new kakao.maps.InfoWindow({ content: `<div class="kakaomap-iw-wrapper"><div class="custom-iw-container">${innerHTMLBlocks}</div></div>`, removable: true });
        kakao.maps.event.addListener(marker, 'click', function() {
            if (currentOpenedInfoWindow) currentOpenedInfoWindow.close();
            map.panTo(markerPosition); infowindow.open(map, marker); currentOpenedInfoWindow = infowindow;
        });
    });

    clusterer.addMarkers(newMarkers);
}

window.onload = function() {
    if (!isServerOpen) return document.getElementById('server-lock-screen').style.display = 'flex';
    if (typeof kakao !== 'undefined') initMap();
    
    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/';
    getUserLocation(true);

    fetch(baseUrl + 'coords_db.csv')
    .then(res => { if(!res.ok) throw new Error(); return res.text(); })
    .then(csvText => {
        Papa.parse(csvText, {
            header: true, skipEmptyLines: true,
            complete: function(results) {
                results.data.forEach(row => {
                    const addr = row['주소']?.trim();
                    const lat = parseFloat(row['위도']);
                    const lng = parseFloat(row['경도']);
                    if (addr && !isNaN(lat) && !isNaN(lng)) {
                        coordMap[addr] = { lat, lng };
                    }
                });
                loadMainStoreData(baseUrl + '전거래처_PS중복.csv');
            }
        });
    })
    .catch(() => {
        document.getElementById('status-msg').innerHTML = `<span style="color:#ef4444;">⚠️ coords_db.csv (위경도 파일) 로드 실패</span>`;
    });
};

function loadMainStoreData(url) {
    fetch(url)
    .then(res => { if(!res.ok) throw new Error(); return res.blob(); })
    .then(blob => { parseCSVFile(blob); })
    .catch(() => { document.getElementById('status-msg').innerHTML = `<span style="color:#ef4444;">⚠️ 전거래처_PS중복.csv 파일을 찾을 수 없습니다.</span>`; });
}

function getUserLocation() {
    const msgEl = document.getElementById('gps-msg');
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                userCoords = { lat: position.coords.latitude, lng: position.coords.longitude };
                msgEl.textContent = `✅ GPS 수신 완료`; msgEl.style.color = "#16a34a";
                if(map) { 
                    const newPos = new kakao.maps.LatLng(userCoords.lat, userCoords.lng); 
                    map.setCenter(newPos); 
                    centerMarker.setPosition(newPos); 
                    centerOverlay.setPosition(newPos); 
                }
                if(csvData.length > 0) { recalculateDistances(); applyFilters(); }
            },
            function() { msgEl.textContent = "❌ GPS 수신실패 (위치 검색을 이용하세요)"; msgEl.style.color = "#ef4444"; if(csvData.length > 0) { recalculateDistances(); applyFilters(); } },
            { enableHighAccuracy: true, timeout: 7000 }
        );
    }
}

function getDistanceHaversine(lat1, lng1, lat2, lng2) {
    const r = 6371; 
    const dLat = (lat2 - lat1) * Math.PI / 180; const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return r * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

function recalculateDistances() {
    csvData.forEach(item => { item.distance = (item.lat && item.lng) ? getDistanceHaversine(userCoords.lat, userCoords.lng, item.lat, item.lng) : 9999; });
}

function handleFileSelect(event) {
    const file = event.target.files[0]; if (!file) return;
    document.getElementById('target-file-name').textContent = `${file.name} (사용자 파일)`;
    parseCSVFile(file);
}

function parseCSVFile(fileOrBlob) {
    Papa.parse(fileOrBlob, {
        header: false, skipEmptyLines: true, encoding: "UTF-8", 
        complete: function(results) {
            let rows = results.data; if(!rows || rows.length === 0) return;
            if (!rows[0].join('').includes('거래처명') && rows[0].join('').match(/[ㄱ-ㅎㅏ-ㅣ가-힣]/) === null) {
                Papa.parse(fileOrBlob, { header: false, skipEmptyLines: true, encoding: "EUC-KR", complete: function(eucRes) { processRows(eucRes.data); } });
            } else { processRows(rows); }
        }
    });
}

// 🛠️ [중요 수정] 이미지 분석을 통해 컬럼의 정확한 인덱스를 재정의했습니다.
function processRows(rows) {
    if(!rows || rows.length <= 1) return alert('유효한 데이터가 없습니다.');
    
    // 테이블 분석 매핑 인덱스
    const idxPcode = 1,      // P코드 (예: PE8774)
          idxName = 2,       // 거래처명 (예: 폰메카컴퍼니)
          idxSido = 3,       // 시도
          idxSigungu = 4,    // 시군구
          idxDong = 5,       // 읍면동
          idxAddress = 6,    // 상세주소
          idxAgencyCode = 7, // 대리점코드 (예: D15146)
          idxAgencyName = 8, // 대리점명 (예: PS&M, 광장대리점) -> 기존 코드에서 중복여부로 밀려있던 부분
          idxScore = 9,      // 대리점실적 (실적 수량) -> 0이 나오던 주범
          idxTotalScore = 10;// 합계수량 (점유율 분모)

    pcodeCounts = {};
    csvData = rows.slice(1).map(row => {
        if (!row || row.length < 2 || !row[idxPcode]) return null;
        const pcodeVal = row[idxPcode].toString().trim();
        pcodeCounts[pcodeVal] = (pcodeCounts[pcodeVal] || 0) + 1;

        // 쉼표 제거 후 숫자로 깔끔하게 포맷팅
        const rawScore = row[idxScore]?.toString().replace(/,/g, '').trim();
        const rawTotal = row[idxTotalScore]?.toString().replace(/,/g, '').trim();
        
        const score = parseInt(rawScore) || 0;
        const total = parseInt(rawTotal) || 0;

        const sido = row[idxSido]?.trim() || '';
        const sigungu = row[idxSigungu]?.trim() || '';
        const rawAddr = row[idxAddress]?.trim() || '';
        
        const fullKey = rawAddr.includes(sido) ? rawAddr : `${sido} ${sigungu} ${rawAddr}`.trim();
        const cache = coordMap[fullKey] || coordMap[rawAddr] || { lat: 0, lng: 0 };

        return {
            pcode: pcodeVal, 
            name: row[idxName]?.trim() || '', 
            sido: sido, 
            sigungu: sigungu,
            dong: row[idxDong]?.trim() || '', 
            address: rawAddr, 
            agencyCode: row[idxAgencyCode]?.trim() || '',
            agency: row[idxAgencyName]?.trim() || '정보없음', // 'PS&M', '광장대리점' 등이 정상 저장됨
            type: row[idxAgencyName]?.trim() || '정보없음', // 중복 검색 호환용
            score: score, 
            ratio: total > 0 ? (score / total) * 100 : 0,
            lat: cache.lat,
            lng: cache.lng,
            distance: 9999
        };
    }).filter(Boolean);

    recalculateDistances(); initFilters(); applyFilters();
}

function initFilters() { ['sido', 'sigungu', 'dong', 'type'].forEach(k => buildDropdown(k, csvData)); }
function buildDropdown(key, data) {
    const listEl = document.getElementById(`${key}-list`);
    const uniqueValues = [...new Set(data.map(item => item[key]))].filter(Boolean).sort();
    listEl.innerHTML = `<li onclick="selectValue('${key}', '')">-- 전체 --</li>`;
    uniqueValues.forEach(val => {
        const li = document.createElement('li'); li.textContent = val;
        li.onclick = function() { selectValue(key, val); }; listEl.appendChild(li);
    });
}

function showDropdown(key) { document.querySelectorAll('.dropdown-list').forEach(el => el.style.display = 'none'); document.getElementById(`${key}-list`).style.display = 'block'; }
function selectValue(key, val) { filters[key] = val; document.getElementById(`search-${key}`).value = val; document.getElementById(`${key}-list`).style.display = 'none'; applyFilters(key); }
function filterDropdown(key) {
    const input = document.getElementById(`search-${key}`).value.toLowerCase();
    if(input === "") filters[key] = "";
    document.querySelectorAll(`#${key}-list li`).forEach((li, i) => { if(i>0) li.style.display = li.textContent.toLowerCase().includes(input) ? 'block' : 'none'; });
    applyFilters(key);
}

function applyFilters(changedKey) {
    const filtered = csvData.filter(item => (!filters.sido || item.sido.includes(filters.sido)) && (!filters.sigungu || item.sigungu.includes(filters.sigungu)) && (!filters.dong || item.dong.includes(filters.dong)) && (!filters.type || item.type.includes(filters.type)));
    ['sido', 'sigungu', 'dong', 'type'].forEach(k => { if (k !== changedKey && !filters[k]) buildDropdown(k, filtered); });
    renderTable(filtered);
}

function renderTable(data) {
    const tbody = document.getElementById('table-body');
    document.getElementById('count').textContent = data.length.toLocaleString();
    tbody.innerHTML = '';
    if (data.length === 0) { tbody.innerHTML = `<tr><td colspan="8" style="color:#ef4444; padding:30px; font-weight:bold;">일치하는 데이터가 없습니다.</td></tr>`; displayStoreMarkersOnMap([]); return; }

    data.sort((a, b) => a.distance - b.distance); 
    displayStoreMarkersOnMap(data);

    data.slice(0, 200).forEach(item => {
        let distTag = item.distance < 9000 ? `<span class="distance-tag">📍 ${item.distance < 1 ? (item.distance * 1000).toFixed(0)+' m' : item.distance.toFixed(2)+' km'}</span>` : "";
        
        // 🛠️ 대리점명 텍스트(예: PS&M, 광장대리점)를 직접 검증하여 원래의 예쁜 전용 색상 배지를 입힙니다.
        let bClass = "badge badge-type";
        if (item.agency.includes('광장대리점')) {
            bClass = "badge badge-gj-agency";
        } else if (item.agency.toUpperCase().includes('PS&M') || item.agency.includes('피에스앤마케팅')) {
            bClass = "badge badge-psm-agency";
        }
        
        tbody.innerHTML += `
            <tr ${pcodeCounts[item.pcode] > 1 ? 'class="duplicate-row"' : ''}>
                <td><b>${item.pcode}</b></td>
                <td title="${item.name}"><b>${item.name}</b></td>
                <td>${item.dong}</td>
                <td class="text-left"><a href="https://map.kakao.com/link/search/${encodeURIComponent(item.sido+' '+item.sigungu+' '+item.address)}" target="_blank" class="map-link">📍 ${item.address}</a>${distTag}</td>
                <td>${item.agencyCode}</td>
                <td><span class="${bClass}">${item.agency}</span></td>
                <td><span class="badge badge-score">${item.ratio.toFixed(1)}%</span></td>
                <td><span class="badge badge-total">${item.score.toLocaleString()}</span></td>
            </tr>`;
    });
    if (data.length > 200) tbody.innerHTML += `<tr><td colspan="8" style="padding:15px; background:#f3f4f6; color:#4b5563; font-weight:bold;">⚠️ 상위 200개만 표시 중입니다. 필터로 범위를 좁혀주세요.</td></tr>`;
}

function resetAllFilters() { filters = { sido: "", sigungu: "", dong: "", type: "" }; ['sido', 'sigungu', 'dong', 'type'].forEach(k => document.getElementById(`search-${k}`).value = ""); if(csvData.length > 0) applyFilters(); }
document.addEventListener('click', function(e) { if (!e.target.closest('.filter-group')) document.querySelectorAll('.dropdown-list').forEach(el => el.style.display = 'none'); });
</script>
